        <!--Bouncing Text Effect -->
    <style>
        .floating-text {
            font-size: 50px;
            font-weight: bold;
            display: inline-block; 
            
            animation: bounce 10s ease-in-out infinite;

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0); 
            }
            50% {
                transform: translateY(-20px);

        }
